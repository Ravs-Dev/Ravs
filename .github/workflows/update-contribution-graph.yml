name: Update contribution graph

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    paths:
      - ".github/workflows/update-contribution-graph.yml"

permissions:
  contents: write

jobs:
  refresh-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download current GitHub contribution calendar
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            "https://ghchart.rshah.org/38bdf8/Ravs-Dev" \
            --output assets/contribution-graph.svg
          grep -q "<svg" assets/contribution-graph.svg

      - name: Commit refreshed graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-graph.svg
          if git diff --cached --quiet; then
            echo "Contribution graph is already up to date."
            exit 0
          fi
          git commit -m "Update GitHub contribution graph"
          git push
